# syntax=docker/sandbox-kit:3
# The generic layer for any project worked on with Claude Code in a sandbox
# (ADR 0076, decision 4): names nothing of Szop. A mixin on Docker's Claude
# Code workload, which base.sbxenv.yaml pins.
schemaVersion: "3"
kind: mixin
displayName: Claude Code base
description: The generic setup for working with Claude Code in a Docker Sandbox
sourceUrl: https://github.com/luiki-dev/szop/tree/main/sandbox/base
version: "0.1.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: [deb.debian.org:443, deb.debian.org:80]
      runtime:
        allow: [mcp.context7.com:443]

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # apt packages cannot travel in an overlay (they need the base's dpkg
        # database), so they are installed at create.
        - command: >-
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends less
          user: "0"
          env:
            - HTTP_PROXY
            - HTTPS_PROXY
            - http_proxy
            - https_proxy
            - NO_PROXY
            - no_proxy
          description: Install a pager
