      name="viewport"

    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Szop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
