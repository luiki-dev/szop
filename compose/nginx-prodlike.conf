# nginx for compose.yaml's prodlike profile, standing in for the demo's load
# balancer: HTTPS on 8443, and a permanent redirect from HTTP (ADR 0064,
# decision 7). Host is $http_host, not $host: the API's cross-site check
# compares Host, port included, with Origin, and $host drops the port.
server {
    listen 8443 ssl;
    ssl_certificate /certs/localhost.pem;
    ssl_certificate_key /certs/localhost.key;

    location / {
        proxy_pass http://app-prodlike:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080;
    return 301 https://localhost:8443$request_uri;
}
