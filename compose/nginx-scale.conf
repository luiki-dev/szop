# nginx for compose.yaml's scale profile: one address in front of app-a and
# app-b, standing in for the demo's load balancer (ADR 0036, decision 14).
# Each request goes to the next instance in turn, nginx's default
# (round-robin). The two are named, not one replicated service, since nginx
# resolves a name once at startup (PH-37 spec, decision 9).
upstream app {
    # Shares the turn between nginx's worker processes. Without it, each
    # worker keeps its own and starts at app-a, and since every new
    # connection may land on another worker, nearly every request went to
    # app-a.
    zone app 64k;
    server app-a:3000;
    server app-b:3000;
}

server {
    # Above 1024, the port the scale profile publishes.
    listen 8080;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
