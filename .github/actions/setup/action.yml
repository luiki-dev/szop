# The steps every job shares after the checkout (ADR 0010, decision 5).
# A composite action cannot check the repository out itself: GitHub must
# clone the repository before it can read an action stored in it.
name: Setup
description: Install pnpm, Node from .nvmrc and the dependencies, with the pnpm store cached.

runs:
  using: composite
  steps:
    # Reads the pnpm version from packageManager in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Fails instead of updating a lockfile that does not match package.json.
    # A composite action's steps take no timeout-minutes, so timeout stops an
    # install stuck on a slow runner after 3 minutes instead of the job's 10
    # (ADR 0053).
    - run: timeout 3m pnpm install --frozen-lockfile
      shell: bash
