# Weekly version updates (ADR 0010, decision 18; details in ADR 0018).
# A later phase adds the terraform ecosystem (OP-068).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new version is proposed only once it is a week old; security updates skip this.
    cooldown:
      default-days: 7
    # Minor and patch updates in one PR; each major update in its own.
    groups:
      npm:
        update-types: [minor, patch]
    # build(deps): … for dependencies, build(deps-dev): … for devDependencies.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    ignore:
      # Its major follows Node's, which changes on purpose with .nvmrc (audit m13).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # The workflows, and the composite action, which is not scanned by default.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    # ci(deps): …
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker-compose
    # PostgreSQL's image in compose.yaml, which CI uses too.
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        update-types: [minor, patch]
    # build(deps): …
    commit-message:
      prefix: build
      include: scope
    ignore:
      # PostgreSQL's major changes on purpose, together with RDS (audit m13).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    # The Node base image in the Dockerfile (ADR 0028).
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]
    # build(deps): …
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Node's major changes on purpose, with .nvmrc and engines (audit m13).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
