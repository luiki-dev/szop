# Checks the production dependencies, direct and transitive, against known
# advisories every day (PH-42). Dependabot's security updates cover direct
# dependencies only (ADR 0010, decision 18); this catches the rest. A failed
# scheduled run makes GitHub email the owner. Nothing here uses a secret.
name: deps-audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # to check the repository out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Exits non-zero for a moderate or higher advisory that no ignored GHSA
      # in pnpm-workspace.yaml covers. See ci-cd.md, "When deps-audit fails".
      - run: pnpm audit --prod --audit-level=moderate
