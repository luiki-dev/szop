# Every quality check, on every PR to main and every push to main
# (ADR 0010, decisions 5-8; details in ADR 0018). The required check is ci-ok.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR cancels the older run. A running run on main is never
  # cancelled; a waiting one can be replaced by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      workflows: ${{ steps.detect.outputs.workflows }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      # On a PR, the checkout is GitHub's test merge of the branch into main:
      # HEAD^1 is main, so the diff is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Push to main: every check runs."
            code=true
            workflows=true
            infra=true
          else
            # --no-renames lists both names of a renamed file.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            # Code is anything that is not Markdown, so new file types are checked by default.
            # Here-strings, not pipes: with pipefail (set by defaults above), an early
            # grep -q exit could fail the pipe.
            if grep -qv '\.md$' <<<"$files"; then code=true; else code=false; fi
            if grep -qE '^\.github/(workflows/|actions/|dependabot\.ya?ml$|zizmor\.ya?ml$)' <<<"$files"; then workflows=true; else workflows=false; fi
            if grep -qE '^(infra/|\.terraform-version$|scripts/check-infra\.sh$|\.github/workflows/ci\.yml$)' <<<"$files"; then infra=true; else infra=false; fi
          fi
          {
            echo "code=$code"
            echo "workflows=$workflows"
            echo "infra=$infra"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code, workflows=$workflows, infra=$infra"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Both checks report in one run; a cancelled run still stops (OP-070).
      - if: success() || failure()
        run: pnpm format:check

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same PostgreSQL as locally, from compose.yaml, so there is one
      # version pin (ADR 0020, decision 6). The tests read the server from
      # apps/api/.env, as a developer's do.
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose up -d --wait
      # Vitest adds its own test report to the job summary when it runs in
      # GitHub Actions.
      - run: pnpm test:coverage
      # Coverage is shown, never gated (ADR 0007, decision 19).
      - name: Coverage summary
        run: |
          {
            echo "## Coverage"
            echo
            jq -r --arg root "$PWD/" '
              "| File | Statements | Branches | Functions | Lines |",
              "|---|---:|---:|---:|---:|",
              (to_entries[] | "| \(.key | ltrimstr($root)) | \(.value.statements.pct)% | \(.value.branches.pct)% | \(.value.functions.pct)% | \(.value.lines.pct)% |")
            ' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The production build of the web app. It fails when the first screen
      # needs more than 200 KB of JavaScript (NFR-3, ADR 0023, decision 4);
      # the log shows the size.
      - run: pnpm build

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same PostgreSQL as the test job, from compose.yaml (ADR 0020,
      # decision 6). start-server.ts reads the server from apps/api/.env and
      # creates szop_e2e itself.
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose up -d --wait
      # Every run, not cached: restoring a cache takes about as long as the
      # download, and the system libraries come from apt anyway (ADR 0026,
      # decision 5).
      - name: Install Playwright's browsers
        run: pnpm --filter @szop/e2e exec playwright install --with-deps chromium firefox
      # Builds the app, then runs every journey on the three projects.
      - run: pnpm test:e2e
      # The HTML report, with the trace and screenshot of every failed test,
      # kept for 14 days (ADR 0010, decision 9).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The commit the image is built from, which /api/health reports (PH-12d
      # spec, decision 3). Read from the checkout, so a pull request's merge
      # commit is what the image names.
      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Builds without pushing (ADR 0010, decisions 7 and 10) and loads the
      # image into the runner's Docker as szop:local. The layers of every
      # stage are cached in GitHub's cache (ADR 0010, decision 9). The app's
      # dependencies are installed only inside the build, never on the runner
      # (ADR 0012, decision 18).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: szop:local
          build-args: GIT_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts the image next to PostgreSQL from compose.yaml and checks it
      # (ADR 0028); on failure it prints the app's logs. It checks that
      # /api/health reports the commit the image was built with.
      - run: scripts/check-image.sh --no-build
        env:
          GIT_COMMIT: ${{ steps.commit.outputs.sha }}

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/tflint.md).
      TFLINT_VERSION: 0.64.0
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one exact version, shared with tenv on the owner's machine.
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: tflint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/tflint.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # GITHUB_TOKEN only keeps tflint --init from being rate-limited by
      # GitHub's API when it downloads the AWS ruleset. No AWS credentials.
      - run: scripts/check-infra.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  commits:
    name: commits
    # Every PR, whatever it changes, so no need to wait for changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Every commit on the branch that is not on main: HEAD^1 is main,
      # HEAD^2 the branch. Merge commits are skipped by commitlint's defaults.
      # On main there is nothing to check: every commit came through a PR.
      - id: commitlint
        run: pnpm exec commitlint --from HEAD^1 --to HEAD^2 --verbose

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/actionlint.md).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Findings fail the job and show as annotations; nothing is uploaded.
      # Runs after a failed actionlint too, so both report in one run; a
      # cancelled run still stops (OP-070). The version matches the one in
      # docs/development/setup.md, so CI and the local hook run the same zizmor.
      - if: success() || failure()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  ci-ok:
    name: ci-ok
    needs:
      [
        changes,
        lint,
        typecheck,
        test,
        build,
        e2e,
        docker,
        infra,
        commits,
        workflows,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Passes when changes succeeded and every other job succeeded or was
      # skipped. A failed changes job leaves the rest skipped (audit m10).
      - id: check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null
