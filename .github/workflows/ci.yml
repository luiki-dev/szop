# Every quality check, on every PR to main and every push to main
# (ADR 0010, decisions 5-8; details in ADR 0018). The required check is ci-ok.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR cancels the older run. A running run on main is never
  # cancelled; a waiting one can be replaced by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      workflows: ${{ steps.detect.outputs.workflows }}
    steps:
      # On a PR, the checkout is GitHub's test merge of the branch into main:
      # HEAD^1 is main, so the diff is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          exit 1
          if [ "$EVENT" != pull_request ]; then
            echo "Push to main: every check runs."
            code=true
            workflows=true
          else
            # --no-renames lists both names of a renamed file.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            # Code is anything that is not Markdown, so new file types are checked by default.
            # Here-strings, not pipes: with pipefail (set by defaults above), an early
            # grep -q exit could fail the pipe.
            if grep -qv '\.md$' <<<"$files"; then code=true; else code=false; fi
            if grep -qE '^\.github/(workflows/|actions/|dependabot\.ya?ml$|zizmor\.ya?ml$)' <<<"$files"; then workflows=true; else workflows=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
          echo "code=$code, workflows=$workflows"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  commits:
    name: commits
    # Every PR, whatever it changes, so no need to wait for changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Every commit on the branch that is not on main: HEAD^1 is main,
      # HEAD^2 the branch. Merge commits are skipped by commitlint's defaults.
      # On main there is nothing to check: every commit came through a PR.
      - id: commitlint
        run: pnpm exec commitlint --from HEAD^1 --to HEAD^2 --verbose

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/actionlint.md).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Findings fail the job and show as annotations; nothing is uploaded.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  ci-ok:
    name: ci-ok
    needs: [changes, lint, typecheck, test, commits, workflows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Passes when changes succeeded and every other job succeeded or was
      # skipped. A failed changes job leaves the rest skipped (audit m10).
      - id: check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null
