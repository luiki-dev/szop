# Every quality check, on every PR to main and every push to main
# (ADR 0010, decisions 5-8; details in ADR 0018). The required check is ci-ok.
#
# One job, plan, assumes an AWS role: szop-ci-plan, read-only and trusted for
# pull requests of this repository only. It plans infra/base and infra/demo
# and has IAM Access Analyzer validate every IAM policy, and a failed plan or
# a serious finding fails the job (PH-35 spec, decision 4; ADR 0010, decisions
# 14 and 16; ADR 0032, decisions 4, 8 and 11). The plan was a workflow of its
# own until PH-35 folded it in, so that one workflow gives one gate, ci-ok.
#
# Two jobs scan with Trivy, scan-config (the Terraform code and the
# Dockerfile) and scan-image (the image docker built), and block on serious
# findings (PH-35 spec, decisions 1 to 3 and 11). A last job, comment, puts
# what plan and both scans found into one PR comment and the run's summary. It
# is not part of ci-ok: the gate is the jobs themselves, not their report.
#
# The jobs are split so that no job holds both AWS credentials and a write
# token: plan holds id-token: write, comment holds pull-requests: write, and
# plan hands what it found to comment as an artifact. What it finds can hold
# names a PR author chose, so it only ever travels as files, never through
# ${{ }}.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR cancels the older run. A running run on main is never
  # cancelled; a waiting one can be replaced by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      workflows: ${{ steps.detect.outputs.workflows }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      # On a PR, the checkout is GitHub's test merge of the branch into main:
      # HEAD^1 is main, so the diff is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Push to main: every check runs."
            code=true
            workflows=true
            infra=true
          else
            # --no-renames lists both names of a renamed file.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$files"
            # Code is anything that is not Markdown, so new file types are checked by default.
            # Here-strings, not pipes: with pipefail (set by defaults above), an early
            # grep -q exit could fail the pipe.
            if grep -qv '\.md$' <<<"$files"; then code=true; else code=false; fi
            if grep -qE '^\.github/(workflows/|actions/|dependabot\.ya?ml$|zizmor\.ya?ml$)' <<<"$files"; then workflows=true; else workflows=false; fi
            if grep -qE '^(infra/|\.terraform-version$|scripts/check-infra\.sh$|\.github/workflows/ci\.yml$)' <<<"$files"; then infra=true; else infra=false; fi
          fi
          {
            echo "code=$code"
            echo "workflows=$workflows"
            echo "infra=$infra"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code, workflows=$workflows, infra=$infra"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Both checks report in one run; a cancelled run still stops (OP-070).
      - if: success() || failure()
        run: pnpm format:check

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same PostgreSQL as locally, from compose.yaml, so there is one
      # version pin (ADR 0020, decision 6). The tests read the server from
      # apps/api/.env, as a developer's do.
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose up -d --wait
      # Vitest adds its own test report to the job summary when it runs in
      # GitHub Actions.
      - run: pnpm test:coverage
      # Coverage is shown, never gated (ADR 0007, decision 19).
      - name: Coverage summary
        run: |
          {
            echo "## Coverage"
            echo
            jq -r --arg root "$PWD/" '
              "| File | Statements | Branches | Functions | Lines |",
              "|---|---:|---:|---:|---:|",
              (to_entries[] | "| \(.key | ltrimstr($root)) | \(.value.statements.pct)% | \(.value.branches.pct)% | \(.value.functions.pct)% | \(.value.lines.pct)% |")
            ' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The production build of the web app. It fails when the first screen
      # needs more than 200 KB of JavaScript (NFR-3, ADR 0023, decision 4);
      # the log shows the size.
      - run: pnpm build

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same PostgreSQL as the test job, from compose.yaml (ADR 0020,
      # decision 6). start-server.ts reads the server from apps/api/.env and
      # creates szop_e2e itself.
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose up -d --wait
      # Every run, not cached: restoring a cache takes about as long as the
      # download, and the system libraries come from apt anyway (ADR 0026,
      # decision 5).
      - name: Install Playwright's browsers
        run: pnpm --filter @szop/e2e exec playwright install --with-deps chromium firefox
      # Builds the app, then runs every journey on the three projects.
      - run: pnpm test:e2e
      # The HTML report, with the trace and screenshot of every failed test,
      # kept for 14 days (ADR 0010, decision 9).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The commit the image is built from, which /api/health reports (PH-12d
      # spec, decision 3). Read from the checkout, so a pull request's merge
      # commit is what the image names.
      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Builds without pushing (ADR 0010, decisions 7 and 10) and loads the
      # image into the runner's Docker as szop:local. The layers of every
      # stage are cached in GitHub's cache (ADR 0010, decision 9). The app's
      # dependencies are installed only inside the build, never on the runner
      # (ADR 0012, decision 18).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: szop:local
          build-args: GIT_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts the image next to PostgreSQL from compose.yaml and checks it
      # (ADR 0028); on failure it prints the app's logs. It checks that
      # /api/health reports the commit the image was built with.
      - run: scripts/check-image.sh --no-build
        env:
          GIT_COMMIT: ${{ steps.commit.outputs.sha }}
      # Starts two instances of the same image behind nginx on a fresh
      # database: both must migrate, one waiting for the other's lock, and
      # both must answer through nginx (ADR 0036, decision 14; PH-37 spec,
      # decision 10). On failure it prints both apps' and nginx's logs.
      - run: scripts/check-scale.sh --no-build
        env:
          GIT_COMMIT: ${{ steps.commit.outputs.sha }}

      # The image as a file for scan-image, which scans it in a job of its own
      # so Trivy never runs next to this job's build cache token (PH-35 spec,
      # decision 11). Pull requests only: nothing scans a push to main.
      - if: github.event_name == 'pull_request'
        run: docker save szop:local -o "$RUNNER_TEMP/szop.tar"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/szop.tar
          retention-days: 1
          if-no-files-found: error

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/tflint.md).
      TFLINT_VERSION: 0.64.0
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one exact version, shared with tenv on the owner's machine.
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: tflint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/tflint.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # GITHUB_TOKEN only keeps tflint --init from being rate-limited by
      # GitHub's API when it downloads the AWS ruleset. No AWS credentials.
      - run: scripts/check-infra.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # A job of its own, not a step of infra or docker: Trivy then holds nothing
  # but contents: read, and never the AWS credentials or the build cache token
  # of the jobs that have them (PH-35 spec, decision 11). Pull requests only:
  # the artifact step gives the job the Actions runtime token, harmless on a
  # PR but able to write main's cache on a push to main. Every commit on main
  # came through a PR that was scanned.
  scan-config:
    name: scan-config
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/trivy.md).
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Fails on a blocking finding or a scan that did not run. The JSON is
      # written first, so the artifact holds the findings of a failed scan too.
      - run: scripts/scan.sh config --json "$RUNNER_TEMP/scan-config.json"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-config
          path: ${{ runner.temp }}/scan-config.json
          retention-days: 1
          if-no-files-found: ignore

  # Scans the image docker built, from the archive it saved: no Docker daemon,
  # and Trivy holds nothing but contents: read, as in scan-config. The
  # vulnerability database is downloaded on every run (a few seconds), not
  # cached: a cache would give the job the cache token for a saving that does
  # not matter (PH-35 spec, Installing Trivy).
  scan-image:
    name: scan-image
    needs: [changes, docker]
    if: github.event_name == 'pull_request' && needs.docker.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/trivy.md). The same as scan-config's.
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Fails on a blocking finding or a scan that did not run. The JSON is
      # written first, so the artifact holds the findings of a failed scan too.
      - run: scripts/scan.sh image --input "$RUNNER_TEMP/szop.tar" --json "$RUNNER_TEMP/scan-image.json"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-image
          path: ${{ runner.temp }}/scan-image.json
          retention-days: 1
          if-no-files-found: ignore

  # Pull requests of this repository only: the role trusts nothing else (no
  # OIDC token for forks, none on a push), and the plan is of the PR's merge
  # into main. Never on a push to main.
  plan:
    name: plan
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # to check the repository out
      id-token: write # to ask GitHub for the OIDC token AWS trusts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: eu-central-1

      # The account ID is read from the credentials, never stored in GitHub, and
      # masked, so it shows as *** in every later log line (ARNs in the plan too).
      - name: Set the account ID for Terraform
        run: |
          id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$id"
          echo "TF_VAR_account_id=$id" >> "$GITHUB_ENV"

      # The one exact version, shared with tenv on the owner's machine.
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      # One folder per module under $RUNNER_TEMP/plan, holding what the comment
      # needs: result (ok or failed), counts.json, changes.json, findings.jsonl,
      # unchecked.txt, aa-errors.txt and checked. A module that fails is
      # recorded as failed and does not stop the other one, and the step itself
      # ends green, so once it has started the artifact below is written; the
      # last step decides whether the job fails. When an earlier step fails
      # (the checkout, the AWS credentials) the step never starts, there is no
      # artifact, and the comment job shows both modules as failed.
      - name: Plan each module and validate its IAM policies
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          plan_module() {
            local m=$1 out="$RUNNER_TEMP/plan/$1" refresh=() rc item address kind doc n=0 result parsed
            local type_args=() var_args=()
            mkdir -p "$out"
            : > "$out/findings.jsonl"
            : > "$out/unchecked.txt"
            : > "$out/aa-errors.txt"

            # base is planned without refreshing the live resources: the AWS
            # provider decrypts the Better Auth secret when it refreshes it,
            # and szop-ci-plan is denied that. The plan still shows what the
            # code changes (ADR 0032, decision 11).
            if [ "$m" = base ]; then
              refresh=(-refresh=false)
            fi

            # demo refuses a plan without a commit (spec of PH-12b, decision 7),
            # and the PR's head commit shows what demo-up on that branch would do.
            if [ "$m" = demo ]; then
              var_args=(-var "deployed_commit=$HEAD_SHA")
            fi

            echo "::group::terraform init infra/$m"
            terraform -chdir="infra/$m" init -input=false -no-color
            rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || return 1

            # -lock=false: the role never writes the lock file. The plan takes
            # no lock, so cancelling it halfway (a newer push to the PR) is safe.
            echo "::group::terraform plan infra/$m"
            terraform -chdir="infra/$m" plan -lock=false -input=false -no-color \
              "${refresh[@]}" "${var_args[@]}" -out="$RUNNER_TEMP/$m.tfplan"
            rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || return 1

            terraform -chdir="infra/$m" show -json "$RUNNER_TEMP/$m.tfplan" > "$RUNNER_TEMP/$m.json" || return 1

            # Data source reads and untouched resources are not changes. A
            # replace counts as one add and one destroy, as Terraform's own
            # summary does.
            jq '[(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"])]
                | {
                    add: ([.[] | select(.change.actions | index("create"))] | length),
                    change: ([.[] | select(.change.actions == ["update"])] | length),
                    destroy: ([.[] | select(.change.actions | index("delete"))] | length)
                  }' "$RUNNER_TEMP/$m.json" > "$out/counts.json" || return 1
            jq '[(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"])
                | {address, action: (.change.actions | if length == 2 then "replace" else .[0] end)}]' \
              "$RUNNER_TEMP/$m.json" > "$out/changes.json" || return 1

            # Every role's trust policy and every inline or managed policy, in
            # the root module and the child modules. A document missing from
            # planned_values is still unknown: it is read as null.
            jq -c '.planned_values.root_module | recurse(.child_modules[]?) | .resources[]?
                | select(.type == "aws_iam_role" or .type == "aws_iam_role_policy" or .type == "aws_iam_policy")
                | (if .type == "aws_iam_role" then .values.assume_role_policy else .values.policy end) as $doc
                | {
                    address,
                    kind: (if .type == "aws_iam_role" then "trust" else "identity" end),
                    doc: (if ($doc | type) == "string" then $doc else null end)
                  }' "$RUNNER_TEMP/$m.json" > "$out/policies.jsonl" || return 1

            while read -r item; do
              address=$(jq -r '.address' <<<"$item")
              kind=$(jq -r '.kind' <<<"$item")
              doc=$(jq -r '.doc // empty' <<<"$item")
              if [ -z "$doc" ]; then
                echo "$address" >> "$out/unchecked.txt"
                continue
              fi
              n=$((n + 1))
              printf '%s' "$doc" > "$out/policy-$n.json"
              if [ "$kind" = trust ]; then
                type_args=(--policy-type RESOURCE_POLICY --validate-policy-resource-type AWS::IAM::AssumeRolePolicyDocument)
              else
                type_args=(--policy-type IDENTITY_POLICY)
              fi
              echo "::group::Access Analyzer: $address"
              result=$(aws accessanalyzer validate-policy --policy-document "file://$out/policy-$n.json" \
                "${type_args[@]}" --output json </dev/null)
              rc=$?
              # A response that is not the expected JSON counts as a failed
              # validation, never as "no findings".
              if [ "$rc" -eq 0 ] && parsed=$(jq -c --arg address "$address" \
                '.findings[] | {address: $address, findingType, issueCode, findingDetails}' <<<"$result"); then
                if [ -n "$parsed" ]; then
                  tee -a "$out/findings.jsonl" <<<"$parsed"
                fi
              else
                echo "$address" >> "$out/aa-errors.txt"
              fi
              echo "::endgroup::"
            done < "$out/policies.jsonl"
            echo "$n" > "$out/checked"
          }

          for m in base demo; do
            if plan_module "$m"; then
              echo ok > "$RUNNER_TEMP/plan/$m/result"
            else
              echo "::error::The plan of infra/$m failed"
              echo failed > "$RUNNER_TEMP/plan/$m/result"
            fi
          done

      # Only the results are kept: the policy documents the validation read
      # (policy-*.json, policies.jsonl) are its inputs, already in the log.
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: |
            ${{ runner.temp }}/plan
            !${{ runner.temp }}/plan/*/policy-*.json
            !${{ runner.temp }}/plan/*/policies.jsonl
          retention-days: 1
          if-no-files-found: error

      # Last, so that the artifact above is uploaded first. A failed
      # plan, a finding Access Analyzer rates ERROR or SECURITY_WARNING and a
      # policy it could not validate fail the job; WARNING and SUGGESTION do
      # not, nor does a policy that is unknown until applied. One ::error::
      # line per cause. A finding's address comes from the PR, and its code
      # from AWS: control characters are removed so neither can start a
      # workflow command.
      - name: Block on a failed plan or a serious finding
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for m in base demo; do
            out="$RUNNER_TEMP/plan/$m"
            if [ "$(cat "$out/result" 2>/dev/null)" != ok ]; then
              echo "::error::The plan of infra/$m failed"
              failed=1
            fi
            if [ -s "$out/aa-errors.txt" ]; then
              while IFS= read -r address; do
                echo "::error::Access Analyzer could not validate the policy of ${address//[[:cntrl:]]/ } in infra/$m"
              done < "$out/aa-errors.txt"
              failed=1
            fi
            if [ -f "$out/findings.jsonl" ]; then
              serious=$(jq -r 'select(.findingType == "ERROR" or .findingType == "SECURITY_WARNING")
                  | "::error::Access Analyzer \(.findingType) \(.issueCode) on \(.address) in infra/" + $m
                  | gsub("[[:cntrl:]]"; " ")' --arg m "$m" "$out/findings.jsonl")
              if [ -n "$serious" ]; then
                echo "$serious"
                failed=1
              fi
            fi
          done
          exit "$failed"

  commits:
    name: commits
    # Every PR, whatever it changes, so no need to wait for changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Every commit on the branch that is not on main: HEAD^1 is main,
      # HEAD^2 the branch. Merge commits are skipped by commitlint's defaults.
      # On main there is nothing to check: every commit came through a PR.
      - id: commitlint
        run: pnpm exec commitlint --from HEAD^1 --to HEAD^2 --verbose

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Updated by hand: Dependabot cannot see versions inside run steps
      # (docs/development/tools/actionlint.md).
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Findings fail the job and show as annotations; nothing is uploaded.
      # Runs after a failed actionlint too, so both report in one run; a
      # cancelled run still stops (OP-070). The version matches the one in
      # docs/development/setup.md, so CI and the local hook run the same zizmor.
      - if: success() || failure()
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # Puts the plan, Access Analyzer and both scans into one PR comment and the
  # run's summary (PH-35 spec, decisions 6 and 14). It holds the only write
  # token (pull-requests: write) and no AWS credentials, and it is not in
  # ci-ok's needs: a failed comment hides the findings from the conversation,
  # not from the summary, and lets nothing through. The checkout fetches the
  # writer script and nothing else, from the PR's merge commit; that gives a
  # PR author nothing new, since a same-repository author can change this job
  # in ci.yml anyway, and a fork's token is read-only and its post is skipped
  # (ADR 0041, Settled while building). Skipped when none of the three jobs ran
  # (a Markdown-only PR, a push to main).
  comment:
    name: comment
    needs: [changes, docker, plan, scan-config, scan-image]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.plan.result != 'skipped' || needs.scan-config.result != 'skipped' || needs.scan-image.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check the writer script out
      pull-requests: write # to post or update the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /scripts/write-ci-comment.sh
          sparse-checkout-cone-mode: false

      # Each artifact only when its job ran, and a missing one is tolerated:
      # a job that ran but left nothing (a failed checkout, a crashed scan) is
      # shown in the comment as failed, never as "no findings".
      - if: needs.plan.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/results/plan
      - if: needs.scan-config.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-config
          path: ${{ runner.temp }}/results
      - if: needs.scan-image.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-image
          path: ${{ runner.temp }}/results

      # What the jobs found can hold names a PR author or Trivy's database
      # chose: the writer filters them, and the text only ever travels as a
      # file. The env values below are the jobs' results, fixed words, and
      # booleans: whether the PR changed code, and whether a fork's PR
      # changed infra/. The summary always gets the full text; GitHub refuses
      # a comment over 65,536 characters, which would leave the old comment
      # and its verdict in place, so past 60,000 the post gets the short text
      # (ADR 0041, Settled while building).
      - name: Write the comment
        env:
          CHECKED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SCAN_CONFIG_RESULT: ${{ needs.scan-config.result }}
          SCAN_IMAGE_RESULT: ${{ needs.scan-image.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          FORK_INFRA: ${{ needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          scripts/write-ci-comment.sh "$RUNNER_TEMP/results" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(LC_ALL=C.UTF-8 wc -m < "$RUNNER_TEMP/comment.md")" -gt 60000 ]; then
            scripts/write-ci-comment.sh --short "$RUNNER_TEMP/results" > "$RUNNER_TEMP/comment.md"
          fi

      # Not for a fork's PR, whose token is read-only; the summary has the
      # text. The comment is found by its hidden marker, among the ones this
      # workflow's bot wrote, and updated, so a push never adds a second one.
      # comment.md is passed as a file (-F body=@), never through ${{ }}.
      - name: Post or update the comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-scans -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md"
          fi

  ci-ok:
    name: ci-ok
    needs:
      [
        changes,
        lint,
        typecheck,
        test,
        build,
        e2e,
        docker,
        infra,
        scan-config,
        scan-image,
        plan,
        commits,
        workflows,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Passes when changes succeeded and every other job succeeded or was
      # skipped. A failed changes job leaves the rest skipped (audit m10).
      - id: check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null
