# Deploys the demo environment on demand: the push button of ADR 0010,
# decisions 11 and 13. It builds the image of the branch the button is pressed
# on (or of the ref typed in), pushes it to the registry szop if it is not
# there yet, applies infra/demo with that commit and records it in the state
# so demo-down destroys with the same code (ADR 0011, decision 7). Then it runs
# db-setup once, starts the app's one task and waits until /api/health answers
# ok with that commit (PH-12c spec, decisions 5, 6 and 9; PH-12d spec,
# decisions 10 and 11). ADR 0012, decisions 16 and 18 (the
# deploy role is assumed only through the demo environment, and the job that
# holds it runs no project code), ADR 0032, decision 8 (the job that holds a
# write token holds no AWS credentials) and ADR 0034 explain the rest.
#
# The GitHub environment demo, with the owner as its required reviewer, must
# exist before this file is used: a job naming an environment that does not
# exist creates it unprotected, and the deploy would then run with no approval.
name: demo-up

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full 40-digit commit hash; empty: the branch chosen in Use workflow from"
        required: false
        type: string

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

# One deploy at a time, and a running one is never cancelled halfway.
concurrency:
  group: demo-up
  cancel-in-progress: false

jobs:
  # Runs first and needs no approval, so the nightly destroy is switched back
  # on even if the deploy is rejected or fails halfway (GitHub disables a
  # scheduled workflow after 60 days without repository activity). The deploy
  # needs this job, so it never creates a demo while the safety net may be off.
  # It holds a write token and no AWS credentials.
  enable-teardown:
    name: enable-teardown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # to enable demo-down
    steps:
      # Enabling a workflow that is already enabled is not an error.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable demo-down.yml

  # Builds the image in a job of its own, with no AWS credentials and no
  # environment: the Dockerfile's pnpm install and build run project code,
  # which must never run beside the deploy role's token (ADR 0012, decision
  # 18). The approval guards that token, so this job needs none and runs while
  # the owner approves deploy (PH-12c spec, decision 9, refining ADR 0012,
  # decision 16). The image reaches deploy as a workflow artifact.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # to check the repository out
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The ref input reaches checkout through with:, never a shell script. An
      # empty one checks out the commit the button was pressed on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # Whatever the ref was (branch, tag, hash), the image is tagged with the
      # full hash of what is checked out.
      - name: Resolve the commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The checked out commit is not a full commit hash: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loaded into the runner's Docker, never pushed from here. No build
      # cache: an image that is deployed restores nothing a cache could have
      # been poisoned with, as for the release job. A single-platform image with
      # no attestation manifests, so ECR's lifecycle rules count one image per
      # tag (PH-12c spec, decision 9; OP-013).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: szop:${{ steps.commit.outputs.sha }}
          # The image reports the commit it was built from in /api/health,
          # which the deploy job's check reads (PH-12d spec, decision 3).
          build-args: GIT_COMMIT=${{ steps.commit.outputs.sha }}

      - name: Save the image
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: docker save "szop:$COMMIT" | gzip > "$RUNNER_TEMP/image.tar.gz"

      # Already compressed, so the artifact is not compressed again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: deploy
    needs: [enable-teardown, build]
    runs-on: ubuntu-24.04
    # The three waits have deadlines of 10 minutes (db-setup), 15 (the start)
    # and 10 (/api/health), 35 together, and the apply (the database takes
    # about 5) and the state lock's wait (up to 15 minutes) come on top
    # (PH-12d spec, decision 11). Each wait stops the run well before this.
    timeout-minutes: 45
    # Waits for the owner's approval; trusted by szop-ci-deploy for this
    # environment, from any branch.
    environment:
      name: demo
      url: https://szop.dzwoniec.com
    permissions:
      contents: read # to check the repository out
      id-token: write # to ask GitHub for the OIDC token AWS trusts
    steps:
      # The same ref as build, for Terraform's code. No project code runs in
      # this job: Terraform, the AWS CLI, Docker's load, tag and push, git, jq,
      # curl and the shell only (ADR 0012, decision 18).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # A branch can move while the owner approves: the infrastructure must
      # come from the commit the image was built from, or nothing is deployed.
      - name: Resolve the commit
        id: commit
        env:
          BUILT: ${{ needs.build.outputs.sha }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$sha" != "$BUILT" ]; then
            echo "::error::The checked out commit $sha is not the one the image was built from ($BUILT); press demo-up again"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The image comes in and is loaded before any AWS credentials exist
      # (PH-12d spec, decision 11; ADR 0012, decision 18).
      - name: Download the image
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/image/image.tar.gz" | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: eu-central-1

      # The account ID is read from the credentials, never stored in GitHub, and
      # masked, so it shows as *** in every later log line (ARNs in the plan too).
      - name: Set the account ID for Terraform
        run: |
          id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$id"
          echo "TF_VAR_account_id=$id" >> "$GITHUB_ENV"

      # The one exact version, shared with tenv on the owner's machine.
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra/demo init -input=false -lock-timeout=15m

      # Before the apply: on a redeploy Terraform swaps the task definition at
      # once, and the new task must find its image (PH-12c spec, decision 9).
      # The registry's tags are immutable, so an image already there for this
      # commit is kept, not pushed again.
      - name: Push the image
        id: push
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          uri=$(aws ecr describe-repositories --repository-names szop --query 'repositories[0].repositoryUri' --output text)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${uri%%/*}"
          if found=$(aws ecr describe-images --repository-name szop --image-ids "imageTag=$COMMIT" 2>&1); then
            echo "szop:$COMMIT is already in the registry; not pushing it again."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$found" != *ImageNotFoundException* ]]; then
            echo "$found"
            echo "::error::Cannot tell whether szop:$COMMIT is in the registry"
            exit 1
          fi
          docker tag "szop:$COMMIT" "$uri:$COMMIT"
          docker push "$uri:$COMMIT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # deployed_commit ends up in the state, where demo-down reads it.
      - name: Terraform apply
        id: apply
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: terraform -chdir=infra/demo apply -auto-approve -input=false -lock-timeout=15m -no-color -var "deployed_commit=$COMMIT"

      # Creates or updates szop_app, the role the app connects as, before the
      # app starts (PH-12c spec, decisions 5 and 6). It waits to a deadline of
      # 10 minutes, measured in seconds (PH-12d spec, decision 11); db-setup
      # takes well under one. A task that is still running then is stopped, so
      # it cannot go on holding a lock on the database.
      - name: Run db-setup
        id: db-setup
        run: |
          cluster=$(terraform -chdir=infra/demo output -raw cluster)
          task_definition=$(terraform -chdir=infra/demo output -raw db_setup_task_definition)
          subnets=$(terraform -chdir=infra/demo output -raw task_subnets)
          security_group=$(terraform -chdir=infra/demo output -raw task_security_group)
          started=$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" \
            --launch-type FARGATE --propagate-tags TASK_DEFINITION \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=ENABLED}" \
            --output json)
          task=$(jq -r '.tasks[0].taskArn // empty' <<< "$started")
          if [ -z "$task" ]; then
            echo "::error::run-task started no task: $(jq -c '.failures' <<< "$started")"
            exit 1
          fi
          stream="db-setup/db-setup/${task##*/}"
          echo "Started task ${task##*/}; its log is the stream $stream in /szop/app."
          deadline=$((SECONDS + 600))
          status=""
          while (( SECONDS < deadline )); do
            status=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].lastStatus' --output text)
            if [ "$status" = STOPPED ]; then
              break
            fi
            echo "db-setup is $status after $SECONDS seconds"
            sleep 10
          done
          if [ "$status" != STOPPED ]; then
            aws ecs stop-task --cluster "$cluster" --task "$task" --reason "demo-up: db-setup did not stop within 10 minutes" \
              --query 'task.lastStatus' --output text \
              || echo "::warning::Could not stop the db-setup task $task"
            echo "::error::db-setup did not stop within 10 minutes; see the stream $stream in /szop/app"
            exit 1
          fi
          stopped=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --output json)
          code=$(jq -r '.tasks[0].containers[0].exitCode // "none"' <<< "$stopped")
          reason=$(jq -r '.tasks[0].stoppedReason // "none given"' <<< "$stopped")
          if [ "$code" != 0 ]; then
            echo "::error::db-setup exited with code $code (stopped reason: $reason); see the stream $stream in /szop/app"
            exit 1
          fi
          echo "db-setup exited with code 0."

      # Terraform creates the service at zero tasks and ignores its count from
      # then on. At zero (a fresh demo) the start is forced to be a deployment,
      # so the circuit breaker watches the first start too; on a redeploy the
      # count is already one and Terraform's new task definition has started
      # the deployment (PH-12c spec, decision 6; PH-12d spec, decision 10).
      # Then, every 10 seconds, to a deadline of 15 minutes: the primary
      # deployment's rollout state. COMPLETED with one deployment left and as
      # many tasks running as wanted is success; FAILED means the circuit
      # breaker stopped the deployment (ADR 0036, decision 3), so the run
      # fails at once instead of waiting out the deadline. A redeploy can take
      # several minutes: a new task's health checks, then the old one's 30
      # seconds of draining.
      - name: Start the app
        id: start
        run: |
          cluster=$(terraform -chdir=infra/demo output -raw cluster)
          service=$(terraform -chdir=infra/demo output -raw service)
          count=$(aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0].desiredCount' --output text)
          if [ "$count" = 0 ]; then
            aws ecs update-service --cluster "$cluster" --service "$service" --desired-count 1 --force-new-deployment --query 'service.serviceName' --output text
          else
            echo "The service already wants $count task(s); its count is left alone."
          fi
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            # The backticks are JMESPath's literal quotes, not a command substitution.
            # shellcheck disable=SC2016
            state=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query 'services[0].[length(deployments), deployments[?status==`PRIMARY`] | [0].rolloutState, runningCount, desiredCount]' --output text)
            read -r deployments rollout running desired <<< "$state"
            if [ "$rollout" = FAILED ]; then
              # shellcheck disable=SC2016
              aws ecs describe-services --cluster "$cluster" --services "$service" \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutStateReason' --output text
              echo "The service's latest events:"
              aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0].events[:5].message' --output text
              echo "::error::The deployment failed: the circuit breaker stopped it; the previous version keeps serving"
              exit 1
            fi
            if [ "$deployments" = 1 ] && [ "$rollout" = COMPLETED ] && [ "$running" = "$desired" ]; then
              echo "The service is stable with $running task(s) after $SECONDS seconds."
              exit 0
            fi
            echo "After $SECONDS seconds: $deployments deployment(s), the primary one $rollout, $running of $desired task(s) running"
            sleep 10
          done
          echo "The service's latest events:"
          aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0].events[:5].message' --output text
          echo "::error::The service $service was not stable within 15 minutes"
          exit 1

      # A new DNS name or a fresh load balancer can take a few minutes to
      # answer: every 10 seconds, to a deadline of 10 minutes, until the app
      # reports itself and its database up with the commit just deployed. An
      # ok from another commit is the old task, still answering (PH-12d spec,
      # decision 11).
      - name: Wait for the app
        id: wait
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          deadline=$((SECONDS + 600))
          reported=""
          old_answers=false
          while (( SECONDS < deadline )); do
            body=$(curl -fsS --max-time 10 https://szop.dzwoniec.com/api/health || true)
            reported=$(jq -r '.commit // empty' <<< "$body" 2>/dev/null || true)
            old_answers=false
            if [[ "$body" == *'"status":"ok"'* ]]; then
              if [[ "$body" == *"\"commit\":\"$COMMIT\""* ]]; then
                echo "/api/health answers ok after $SECONDS seconds: $body"
                echo "reported=$reported" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              old_answers=true
            fi
            echo "After $SECONDS seconds: /api/health does not answer ok with $COMMIT yet"
            sleep 10
          done
          echo "reported=$reported" >> "$GITHUB_OUTPUT"
          if [ "$old_answers" = true ]; then
            echo "::error::https://szop.dzwoniec.com/api/health still answers with commit ${reported:-unknown}, not $COMMIT: the old version is still serving after 10 minutes"
            exit 1
          fi
          echo "::error::https://szop.dzwoniec.com/api/health did not answer ok within 10 minutes"
          exit 1

      - name: Summary
        if: always()
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          PUSH: ${{ steps.push.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          DB_SETUP: ${{ steps.db-setup.outcome }}
          START: ${{ steps.start.outcome }}
          WAIT: ${{ steps.wait.outcome }}
          REPORTED: ${{ steps.wait.outputs.reported }}
        run: |
          case "$PUSHED" in
            true) image_note="pushed by this run" ;;
            false) image_note="already in the registry" ;;
            *) image_note="not pushed" ;;
          esac
          {
            echo "## demo-up"
            echo
            echo "- URL: https://szop.dzwoniec.com"
            echo "- Commit: \`${COMMIT:-unknown}\`"
            echo "- Image: \`szop:${COMMIT:-unknown}\`, $image_note"
            echo "- Push: $PUSH"
            echo "- Apply: $APPLY"
            echo "- db-setup: $DB_SETUP"
            echo "- Start the app: $START"
            echo "- /api/health answers ok: $WAIT"
            echo "- Commit /api/health reported: \`${REPORTED:-none}\`"
            echo
            echo "\`demo-down\` destroys the demo at the next 01:17 UTC unless pressed sooner."
          } >> "$GITHUB_STEP_SUMMARY"
