# Deploys the landing page, apps/landing/, to GitHub Pages, which serves it on
# dzwoniec.com (PH-34; ADR 0044). The page is plain HTML, CSS and JavaScript,
# so there is no build: the folder is uploaded as it is.
#
# The GitHub environment github-pages is created by GitHub when Pages is
# switched on with the source "GitHub Actions". By default only the default
# branch may deploy to it.
name: pages

on:
  push:
    branches:
      - main
      # Temporary: the first deployment comes from the phase's branch, so the
      # owner can set up the domain and its certificate while the rest is built.
      # A manual run needs this file on the default branch; a push does not.
      # The last task of PH-34 removes this line.
      - feat/landing-page
    paths:
      - apps/landing/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

# One deployment at a time, and a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check the repository out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/landing

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to prove to Pages that the deployment comes from this workflow
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
