# Plans infra/base and infra/demo on every pull request that touches infra/ and
# posts the result as one comment: the resource counts, the changed resources
# and IAM Access Analyzer's findings on every IAM policy (ADR 0010, decisions 14
# and 16; ADR 0032, decisions 4, 8 and 11). It is informative, not a required
# check.
#
# Two jobs, so that no job holds both AWS credentials and a write token:
# plan assumes szop-ci-plan (read-only, trusted for pull requests of this
# repository only) and writes the comment into an artifact; comment has no AWS
# access and posts that file with gh. The comment's text can hold names a PR
# author chose, so it only ever travels as a file, never through ${{ }}.
name: infra-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".terraform-version"
      - ".github/workflows/infra-plan.yml"

permissions: {}

# Every run: step uses bash with -e and -o pipefail; without this, GitHub's default is bash -e only.
defaults:
  run:
    shell: bash

# The plan takes no lock, so cancelling a plan halfway is safe.
concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    # Pull requests from forks get no OIDC token (and the role would refuse them).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # to check the repository out
      id-token: write # to ask GitHub for the OIDC token AWS trusts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: eu-central-1

      # The account ID is read from the credentials, never stored in GitHub.
      - name: Set the account ID for Terraform
        run: echo "TF_VAR_account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      # The one exact version, shared with tenv on the owner's machine.
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      # One folder per module under $RUNNER_TEMP, holding what the comment step
      # needs: result (ok or failed), counts.json, changes.json, findings.jsonl,
      # unchecked.txt and aa-errors.txt. A module that fails is recorded as
      # failed and does not stop the other one, and the step itself always ends
      # green: the plan is informative.
      - name: Plan each module and validate its IAM policies
        run: |
          plan_module() {
            local m=$1 out="$RUNNER_TEMP/$1" refresh=() rc item address kind doc n=0 result
            local type_args=()
            mkdir -p "$out"
            : > "$out/findings.jsonl"
            : > "$out/unchecked.txt"
            : > "$out/aa-errors.txt"

            # base is planned without refreshing the live resources: the AWS
            # provider decrypts the Better Auth secret when it refreshes it,
            # and szop-ci-plan is denied that. The plan still shows what the
            # code changes (ADR 0032, decision 11).
            if [ "$m" = base ]; then
              refresh=(-refresh=false)
            fi

            echo "::group::terraform init infra/$m"
            terraform -chdir="infra/$m" init -input=false -no-color
            rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || return 1

            # -lock=false: the role never writes the lock file.
            echo "::group::terraform plan infra/$m"
            terraform -chdir="infra/$m" plan -lock=false -input=false -no-color \
              "${refresh[@]}" -out="$RUNNER_TEMP/$m.tfplan"
            rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || return 1

            terraform -chdir="infra/$m" show -json "$RUNNER_TEMP/$m.tfplan" > "$RUNNER_TEMP/$m.json" || return 1

            # Data source reads and untouched resources are not changes. A
            # replace counts as one add and one destroy, as Terraform's own
            # summary does.
            jq '[(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"])]
                | {
                    add: ([.[] | select(.change.actions | index("create"))] | length),
                    change: ([.[] | select(.change.actions == ["update"])] | length),
                    destroy: ([.[] | select(.change.actions | index("delete"))] | length)
                  }' "$RUNNER_TEMP/$m.json" > "$out/counts.json" || return 1
            jq '[(.resource_changes // [])[] | select(.change.actions | . != ["no-op"] and . != ["read"])
                | {address, action: (.change.actions | if length == 2 then "replace" else .[0] end)}]' \
              "$RUNNER_TEMP/$m.json" > "$out/changes.json" || return 1

            # Every role's trust policy and every inline or managed policy, in
            # the root module and the child modules. A document missing from
            # planned_values is still unknown: it is read as null.
            jq -c '.planned_values.root_module | recurse(.child_modules[]?) | .resources[]?
                | select(.type == "aws_iam_role" or .type == "aws_iam_role_policy" or .type == "aws_iam_policy")
                | (if .type == "aws_iam_role" then .values.assume_role_policy else .values.policy end) as $doc
                | {
                    address,
                    kind: (if .type == "aws_iam_role" then "trust" else "identity" end),
                    doc: (if ($doc | type) == "string" then $doc else null end)
                  }' "$RUNNER_TEMP/$m.json" > "$out/policies.jsonl" || return 1

            while read -r item; do
              address=$(jq -r '.address' <<<"$item")
              kind=$(jq -r '.kind' <<<"$item")
              doc=$(jq -r '.doc // empty' <<<"$item")
              if [ -z "$doc" ]; then
                echo "$address" >> "$out/unchecked.txt"
                continue
              fi
              n=$((n + 1))
              printf '%s' "$doc" > "$out/policy-$n.json"
              if [ "$kind" = trust ]; then
                type_args=(--policy-type RESOURCE_POLICY --validate-policy-resource-type AWS::IAM::AssumeRolePolicyDocument)
              else
                type_args=(--policy-type IDENTITY_POLICY)
              fi
              echo "::group::Access Analyzer: $address"
              result=$(aws accessanalyzer validate-policy --policy-document "file://$out/policy-$n.json" \
                "${type_args[@]}" --output json </dev/null)
              rc=$?
              if [ "$rc" -eq 0 ]; then
                jq -c --arg address "$address" '.findings[] | {address: $address, findingType, issueCode, findingDetails}' \
                  <<<"$result" | tee -a "$out/findings.jsonl"
              else
                echo "$address" >> "$out/aa-errors.txt"
              fi
              echo "::endgroup::"
            done < "$out/policies.jsonl"
            echo "$n" > "$out/checked"
          }

          for m in base demo; do
            if plan_module "$m"; then
              echo ok > "$RUNNER_TEMP/$m/result"
            else
              echo "::error::The plan of infra/$m failed"
              echo failed > "$RUNNER_TEMP/$m/result"
            fi
          done

      # Always runs, so that a module that never got planned (no credentials,
      # a failed init) still appears in the comment as failed. Everything that
      # came from the PR (addresses, Access Analyzer's messages) passes through
      # a filter: an address goes into a code span, so only backticks and line
      # breaks are removed (the brackets of dkim[0] stay); a message goes into
      # the text, so it also loses angle and square brackets (no HTML or links)
      # and gets no @ that would mention someone.
      - name: Write the comment
        if: always()
        env:
          PLANNED_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The jq programs hold backticks (Markdown code spans) in single quotes on purpose.
          # shellcheck disable=SC2016
          defs='def code: gsub("[`\\r\\n]"; " "); def text: gsub("[`<>\\[\\]\\r\\n]"; " ") | gsub("@"; "@\u200b");'
          {
            echo "<!-- infra-plan -->"
            echo "### Terraform plan"
            echo
            echo "Planned commit: \`$PLANNED_SHA\` (the PR's head, merged into \`main\`). [Run log]($RUN_URL)"
            for m in base demo; do
              out="$RUNNER_TEMP/$m"
              echo
              if [ "$(cat "$out/result" 2>/dev/null)" != ok ]; then
                echo "#### infra/$m: ❌ plan failed, see the log"
                continue
              fi
              jq -r --arg m "$m" '"#### infra/\($m): \(.add) to add, \(.change) to change, \(.destroy) to destroy"' "$out/counts.json"
              jq -r "$defs"'
                  if length == 0 then empty else
                    "", "<details><summary>Changed resources</summary>", "",
                    (.[] | "- `\(.address | code)`: \(.action)"),
                    "", "</details>"
                  end' "$out/changes.json"
              echo
              jq -rs --arg n "$(cat "$out/checked")" "$defs"'
                  def rank: {"ERROR": 0, "SECURITY_WARNING": 1, "WARNING": 2, "SUGGESTION": 3}[.] // 4;
                  if length == 0 then "**IAM Access Analyzer:** no findings (\($n) policies checked)", ""
                  else "**IAM Access Analyzer:** \(length) finding(s) (\($n) policies checked)", ""
                    , (sort_by(.findingType | rank) | .[]
                      | "- \(.findingType): `\(.address | code)`: \(.issueCode): \(.findingDetails | text)")
                  end' "$out/findings.jsonl"
              jq -rR "$defs"'"- ⏳ not checked until applied: `\(. | code)`"' "$out/unchecked.txt"
              jq -rR "$defs"'"- ❌ validation failed, see the log: `\(. | code)`"' "$out/aa-errors.txt"
            done
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"

      - name: Keep the comment for the comment job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-plan-comment
          path: ${{ runner.temp }}/comment.md
          retention-days: 1

  comment:
    name: comment
    needs: plan
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No checkout and no AWS access: the only write token in this workflow.
    permissions:
      pull-requests: write # to post or update the plan comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: infra-plan-comment

      # The comment is found by its hidden marker, among the ones this
      # workflow's bot wrote, and updated, so a push never adds a second one.
      # comment.md is passed as a file (-F body=@), never through ${{ }}.
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- infra-plan -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
