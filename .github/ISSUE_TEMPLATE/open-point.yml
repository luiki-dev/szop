name: Open point
description: "An open point: something undecided or undone, left to a later phase."
title: "OP-"
labels: [open-point]
body:
  - type: textarea
    id: what
    attributes:
      label: What is open
      description: The open point's text, its bold lead first
    validations:
      required: true
  - type: textarea
    id: parts
    attributes:
      label: Parts
      description: One checkbox per phase's part, or leave empty
  - type: textarea
    id: source
    attributes:
      label: Source
    validations:
      required: true
