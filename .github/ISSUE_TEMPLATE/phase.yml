name: Phase
description: A roadmap phase. docs/roadmap.md holds its plan; this issue's body is a link to the entry and the Also section.
title: "PH-"
labels: [phase]
body:
  - type: input
    id: entry
    attributes:
      label: Roadmap entry
      description: Link to the phase's entry in docs/roadmap.md, which holds its plan
    validations:
      required: true
  - type: textarea
    id: also
    attributes:
      label: Also
      description: Open points of other phases this phase does a part of, as issue references
      value: "—"
